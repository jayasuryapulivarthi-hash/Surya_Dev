services:
  api:
    build: .
    container_name: surya_fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: surya_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: Surya_Learning
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: